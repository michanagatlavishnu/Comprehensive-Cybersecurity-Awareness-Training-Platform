<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Account Security Alert</title>
<style>
body{
    background:#f4f6fb;
    font-family:Arial,Helvetica,sans-serif;
}
.container{
    max-width:650px;
    margin:auto;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
}
.header{
    background:#EA4335;
    color:white;
    padding:18px;
    font-size:22px;
    text-align:center;
}
.content{
    padding:30px;
    color:#333;
    line-height:1.7;
}
.button{
    background:#EA4335;
    color:white!important;
    padding:14px 24px;
    text-decoration:none;
    border-radius:6px;
    display:inline-block;
}
.footer{
    background:#F9FAFB;
    padding:18px;
    font-size:12px;
    color:#64748B;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
Google Security
</div>

<div class="content">

<h2>Password Reset Requested</h2>

<p>Hello,</p>

<p>We noticed an attempt to reset your Google password from a new device.</p>

<p>If this wasn't you, secure your account immediately.</p>

<p align="center">
<a class="button" href="{TRACKING_LINK}">
Review Security Activity
</a>
</p>

<p>This link expires in 15 minutes.</p>

<p>Google Security Team</p>

</div>

<div class="footer">
© Google LLC • Security Notification
</div>

</div>

</body>
</html>
