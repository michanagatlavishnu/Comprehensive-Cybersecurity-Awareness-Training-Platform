<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Microsoft Office 365 Security</title>
<style>
body{background:#eef2f7;font-family:Arial;}
.card{max-width:640px;margin:auto;background:white;border-radius:10px;}
.header{background:#0078D4;color:white;padding:20px;text-align:center;font-size:22px;}
.content{padding:30px;color:#333;}
.btn{
background:#0078D4;
color:white!important;
padding:14px 26px;
text-decoration:none;
border-radius:6px;
display:inline-block;
}
.footer{padding:18px;text-align:center;font-size:12px;background:#F8FAFC;}
</style>
</head>

<body>

<div class="card">

<div class="header">
Microsoft Office 365
</div>

<div class="content">

<h2>Your Mailbox Storage is Full</h2>

<p>Your mailbox has exceeded 95% capacity.</p>

<p>Verify your account to continue sending and receiving emails.</p>

<p align="center">
<a class="btn" href="{TRACKING_LINK}">
Verify Mailbox
</a>
</p>

<p>This verification expires today.</p>

</div>

<div class="footer">
Microsoft Corporation
</div>

</div>

</body>
</html>
